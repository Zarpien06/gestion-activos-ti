<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Gestión de Activos TI{% endblock %}</title>

    <!-- Bootstrap -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --sidebar-width: 270px;
            --sidebar-bg: #0f172a;
            --sidebar-hover: #1e293b;
            --sidebar-active: #2563eb;
            --page-bg: #f1f5f9;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            background: var(--page-bg);
            color: #0f172a;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;
            inset: 0 auto 0 0;
            z-index: 1050;
            width: var(--sidebar-width);
            overflow-y: auto;
            background: var(--sidebar-bg);
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 90px;
            padding: 18px;
            border-bottom: 1px solid #334155;
        }

        .brand-icon {
            display: flex;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            color: white;
            background: var(--sidebar-active);
            border-radius: 14px;
            font-size: 23px;
        }

        .sidebar-brand h1 {
            margin: 0;
            color: white;
            font-size: 17px;
            font-weight: 700;
        }

        .sidebar-brand p {
            margin: 4px 0 0;
            color: #94a3b8;
            font-size: 13px;
        }

        .sidebar-menu {
            padding: 15px 10px;
        }

        .menu-button {
            display: flex;
            align-items: center;
            gap: 13px;
            width: 100%;
            margin-bottom: 6px;
            padding: 13px 15px;
            color: #cbd5e1;
            text-decoration: none;
            border-radius: 11px;
            transition: all 0.2s ease;
        }

        .menu-button:hover {
            color: white;
            background: var(--sidebar-hover);
            transform: translateX(3px);
        }

        .menu-button.active {
            color: white;
            background: var(--sidebar-active);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
        }

        .menu-button i {
            width: 22px;
            font-size: 18px;
            text-align: center;
        }

        /* =========================
           MAIN
        ========================= */

        .main-wrapper {
            min-height: 100vh;
            margin-left: var(--sidebar-width);
        }

        /* =========================
           TOPBAR
        ========================= */

        .topbar {
            position: sticky;
            top: 0;
            z-index: 1020;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 14px 25px;
            background: white;
            border-bottom: 1px solid var(--border-color);
        }

        .search-container {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 620px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 10px;
        }

        .search-container i {
            padding-left: 14px;
            color: #64748b;
        }

        .search-container input {
            width: 100%;
            padding: 11px 13px;
            background: transparent;
            border: 0;
            outline: none;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .topbar-actions a {
            color: #334155;
            text-decoration: none;
        }

        .topbar-actions a:hover {
            color: var(--sidebar-active);
        }

        /* =========================
           CONTENT
        ========================= */

        .page-content {
            padding: 28px;
        }

        .card {
            border: 0;
            border-radius: 16px;
            box-shadow: 0 5px 22px rgba(15, 23, 42, 0.07);
        }

        .card-header {
            padding: 17px 20px;
            background: white;
            border-bottom: 1px solid var(--border-color);
            border-radius: 16px 16px 0 0 !important;
            font-weight: 600;
        }

        .btn,
        .form-control,
        .form-select {
            border-radius: 9px;
        }

        .table {
            vertical-align: middle;
        }

        /* =========================
           MOBILE
        ========================= */

        .mobile-menu-button {
            display: none;
        }

        .sidebar-overlay {
            display: none;
        }

        @media (max-width: 900px) {

            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.25s ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar-overlay.open {
                position: fixed;
                inset: 0;
                z-index: 1040;
                display: block;
                background: rgba(15, 23, 42, 0.55);
            }

            .main-wrapper {
                margin-left: 0;
            }

            .mobile-menu-button {
                display: inline-flex;
            }

            .topbar {
                padding: 12px 16px;
            }

            .page-content {
                padding: 18px;
            }

            .user-label {
                display: none;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

    <!-- Overlay móvil -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside id="sidebar" class="sidebar">

        <div class="sidebar-brand">

            <div class="brand-icon">
                <i class="bi bi-laptop"></i>
            </div>

            <div>
                <h1>Gestión de Activos TI</h1>
                <p>Editorial Planeta</p>
            </div>

        </div>

        <nav class="sidebar-menu">

            <!-- Dashboard -->
            <a
                href="/"
                class="menu-button {% if request.path == '/' %}active{% endif %}">
                <i class="bi bi-grid-1x2"></i>
                <span>Dashboard</span>
            </a>

            <!-- Inventario -->
            <a
                href="/inventario"
                class="menu-button {% if request.path.startswith('/inventario') %}active{% endif %}">
                <i class="bi bi-pc-display"></i>
                <span>Inventario</span>
            </a>

            <!-- Personas -->
            <a
                href="/personas"
                class="menu-button {% if request.path.startswith('/personas') %}active{% endif %}">
                <i class="bi bi-people"></i>
                <span>Personas</span>
            </a>

            <!-- Asignaciones -->
            <a
                href="/asignaciones"
                class="menu-button {% if request.path.startswith('/asignaciones') %}active{% endif %}">
                <i class="bi bi-box-arrow-up-right"></i>
                <span>Asignaciones</span>
            </a>

            <!-- Devoluciones -->
            <a
                href="/devoluciones"
                class="menu-button {% if request.path.startswith('/devoluciones') %}active{% endif %}">
                <i class="bi bi-arrow-return-left"></i>
                <span>Devoluciones</span>
            </a>

            <!-- Tickets -->
            <a
                href="/tickets"
                class="menu-button {% if request.path.startswith('/tickets') %}active{% endif %}">
                <i class="bi bi-tools"></i>
                <span>Tickets</span>
            </a>

            <!-- Actas -->
            <a
                href="/actas"
                class="menu-button {% if request.path.startswith('/actas') %}active{% endif %}">
                <i class="bi bi-file-earmark-pdf"></i>
                <span>Actas</span>
            </a>

            <!-- Reportes -->
            <a
                href="/reportes"
                class="menu-button {% if request.path.startswith('/reportes') %}active{% endif %}">
                <i class="bi bi-bar-chart"></i>
                <span>Reportes</span>
            </a>

            <!-- Configuración -->
            <a
                href="/configuracion"
                class="menu-button {% if request.path.startswith('/configuracion') %}active{% endif %}">
                <i class="bi bi-gear"></i>
                <span>Configuración</span>
            </a>

        </nav>

    </aside>

    <!-- =========================
         MAIN WRAPPER
    ========================= -->

    <div class="main-wrapper">

        <!-- =========================
             TOPBAR
        ========================= -->

        <header class="topbar">

            <div class="d-flex align-items-center gap-3 flex-grow-1">

                <!-- Botón menú móvil -->
                <button
                    id="mobileMenuButton"
                    type="button"
                    class="btn btn-outline-secondary mobile-menu-button"
                    aria-label="Abrir menú">

                    <i class="bi bi-list"></i>

                </button>

                <!-- Buscador -->
                <div class="search-container">

                    <i class="bi bi-search"></i>

                    <input
                        id="busquedaGlobal"
                        type="search"
                        placeholder="Buscar en la página actual"
                        autocomplete="off">

                </div>

            </div>

            <!-- Acciones -->
            <div class="topbar-actions">

                <button
                    type="button"
                    class="btn btn-light"
                    title="Notificaciones">

                    <i class="bi bi-bell"></i>

                </button>

                <a href="/" title="Perfil">

                    <i class="bi bi-person-circle me-1"></i>

                    <span class="user-label">
                        Oscar Cruz
                    </span>

                </a>

            </div>

        </header>

        <!-- =========================
             PAGE CONTENT
        ========================= -->

        <main class="page-content">

            {% block content %}{% endblock %}

        </main>

    </div>

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("sidebarOverlay");
        const mobileButton = document.getElementById("mobileMenuButton");
        const searchInput = document.getElementById("busquedaGlobal");

        // Abrir menú
        function openMenu() {

            if (sidebar) {
                sidebar.classList.add("open");
            }

            if (overlay) {
                overlay.classList.add("open");
            }

        }

        // Cerrar menú
        function closeMenu() {

            if (sidebar) {
                sidebar.classList.remove("open");
            }

            if (overlay) {
                overlay.classList.remove("open");
            }

        }

        // Botón móvil
        if (mobileButton) {

            mobileButton.addEventListener(
                "click",
                openMenu
            );

        }

        // Overlay
        if (overlay) {

            overlay.addEventListener(
                "click",
                closeMenu
            );

        }

        // Cerrar menú al seleccionar una opción
        document
            .querySelectorAll(".menu-button")
            .forEach(function (link) {

                link.addEventListener(
                    "click",
                    closeMenu
                );

            });

        // Buscador global de la página
        if (searchInput) {

            searchInput.addEventListener(
                "input",
                function () {

                    const searchText = this.value
                        .toLowerCase()
                        .trim();

                    document
                        .querySelectorAll("tbody tr")
                        .forEach(function (row) {

                            const rowText = (
                                row.innerText || ""
                            ).toLowerCase();

                            row.style.display =
                                rowText.includes(searchText)
                                    ? ""
                                    : "none";

                        });

                }
            );

        }

    </script>

    {% block extra_js %}{% endblock %}

</body>
</html>
