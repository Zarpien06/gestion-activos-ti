{% extends "base.html" %}

{% block title %}Configuración | Gestión TI{% endblock %}

{% block extra_css %}
<style>
    .page-header { margin-bottom: 24px; }
    .page-header h1 { margin: 0; font-size: 24px; font-weight: 700; }
    .page-header p { margin: 4px 0 0; color: var(--text-light); }

    .form-card { max-width: 720px; }

    .card-title { margin: 0; font-size: 16px; font-weight: 600; }
    .card-sub { margin: 2px 0 0; color: var(--text-light); font-size: 13px; }

    .form-body { display: flex; flex-direction: column; gap: 18px; margin-top: 20px; }

    .form-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid var(--border);
    }

    @media (max-width: 768px) {
        .form-actions .btn { width: 100%; }
    }
</style>
{% endblock %}


{% block content %}

<div class="page-header">
    <h1>Configuración</h1>
    <p>Datos generales del sistema.</p>
</div>

<div class="card form-card">

    <h2 class="card-title">Sistema Gestión Activos TI</h2>
    <p class="card-sub">Editorial Planeta</p>

    <div class="form-body">

        <div>
            <label for="nombre_empresa">Nombre empresa</label>
            <input id="nombre_empresa" class="form-control" value="Editorial Planeta">
        </div>

        <div>
            <label for="correo_soporte">Correo soporte</label>
            <input id="correo_soporte" type="email" class="form-control"
                   placeholder="soporte@planeta.com.co">
        </div>

    </div>

    <div class="form-actions">
        <button type="button" class="btn">Guardar</button>
    </div>

</div>

{% endblock %}
