<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Gestión Activos TI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='Logo.png') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-soft: #eef2ff;
            --surface: #ffffff;
            --border: #e5e7eb;
            --text: #111827;
            --text-light: #6b7280;
            --danger: #dc2626;
            --warning: #d97706;
            --success: #16a34a;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #818cf8;
                --primary-hover: #a5b4fc;
                --primary-soft: rgba(129,140,248,.14);
                --surface: #131c31;
                --border: #243050;
                --text: #e5e9f2;
                --text-light: #93a0b8;
            }
        }

        * { box-sizing: border-box; }

        body {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            overflow: hidden;
            color: var(--text);
            background: #0b1120;
            font-family: "Inter", "Segoe UI", system-ui, sans-serif;
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 520px;
            height: 520px;
            border-radius: 50%;
            filter: blur(110px);
            opacity: .55;
            z-index: 0;
            pointer-events: none;
        }

        body::before { top: -160px; left: -140px; background: #4f46e5; }
        body::after  { bottom: -180px; right: -120px; background: #7c3aed; }

        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            padding: 40px 36px 32px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 30px 70px rgba(0,0,0,.35);
            animation: rise .35s ease;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: none; }
        }

        .login-header { text-align: center; margin-bottom: 28px; }

        .login-icon {
    width: 90px;
    height: 90px;
    margin: 0 auto 18px;
    filter: drop-shadow(0 8px 20px rgba(99,102,241,.5));
}

.login-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

        .login-header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -.02em;
        }

        .login-header p { margin: 6px 0 0; color: var(--text-light); }

        .form-group { margin-bottom: 18px; }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 11px 14px;
            color: var(--text);
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            font-size: 14.5px;
            transition: border-color .18s ease, box-shadow .18s ease;
        }

        .form-control::placeholder { color: var(--text-light); }
        .form-control:hover { border-color: #9ca3af; }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-soft);
        }

        .password-wrap { position: relative; }
        .password-wrap .form-control { padding-right: 70px; }

        .toggle-pass {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            padding: 4px 8px;
            color: var(--text-light);
            background: transparent;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12.5px;
            font-weight: 600;
        }

        .toggle-pass:hover { color: var(--primary); }

        .remember-row {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 22px;
            color: var(--text-light);
            cursor: pointer;
        }

        .remember-row input { accent-color: var(--primary); width: 16px; height: 16px; }

        .login-button {
            width: 100%;
            padding: 12px;
            color: #fff;
            background: var(--primary);
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14.5px;
            font-weight: 600;
            transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
            box-shadow: 0 6px 16px rgba(79,70,229,.35);
        }

        .login-button:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 10px 22px rgba(79,70,229,.4);
        }

        .login-button:active { transform: none; }
        .login-button:disabled { opacity: .7; cursor: wait; transform: none; }

        .alert {
            margin-bottom: 18px;
            padding: 11px 14px;
            border: 1px solid;
            border-radius: 10px;
            font-size: 13.5px;
            font-weight: 500;
        }

        .alert-danger  { color: var(--danger);  background: color-mix(in srgb, var(--danger) 10%, var(--surface));  border-color: color-mix(in srgb, var(--danger) 30%, transparent); }
        .alert-warning { color: var(--warning); background: color-mix(in srgb, var(--warning) 10%, var(--surface)); border-color: color-mix(in srgb, var(--warning) 30%, transparent); }
        .alert-success { color: var(--success); background: color-mix(in srgb, var(--success) 10%, var(--surface)); border-color: color-mix(in srgb, var(--success) 30%, transparent); }

        .security-note {
            margin-top: 24px;
            padding-top: 18px;
            color: var(--text-light);
            text-align: center;
            font-size: 12.5px;
            border-top: 1px solid var(--border);
        }

        @media (max-width: 480px) {
            .login-card { padding: 32px 22px 26px; border-radius: 16px; }
        }
    </style>
</head>
<body>
    <main class="login-card">
        <header class="login-header">
            <div class="login-icon">
    <img src="{{ url_for('static', filename='img/Logo.png') }}" alt="Logo Editorial Planeta">
</div>
            <h1>Gestión de Activos TI</h1>
            <p>Ingresa para acceder al sistema</p>
        </header>

        {% with mensajes = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensaje in mensajes %}
                <div class="alert alert-{{ categoria }}" role="alert">{{ mensaje }}</div>
            {% endfor %}
        {% endwith %}

        <form id="loginForm" method="POST" action="{{ url_for('login', next=request.args.get('next')) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="username">Usuario</label>
                <input id="username" name="username" type="text" class="form-control"
                       autocomplete="username" autocapitalize="none" spellcheck="false"
                       placeholder="Ejemplo: uocf3a" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="password-wrap">
                    <input id="password" name="password" type="password" class="form-control"
                           autocomplete="current-password" required>
                    <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostrar contraseña">Mostrar</button>
                </div>
            </div>

            <label class="remember-row">
                <input name="recordar" type="checkbox">
                <span>Recordar sesión</span>
            </label>

            <button id="loginButton" type="submit" class="login-button">Iniciar sesión</button>
        </form>

        <div class="security-note">
            La sesión se cierra automáticamente después de 30 minutos de inactividad.
        </div>
    </main>

    <script>
        (function () {
            const form = document.getElementById("loginForm");
            const button = document.getElementById("loginButton");
            const pass = document.getElementById("password");
            const toggle = document.getElementById("togglePass");

            let enviado = false;
            form.addEventListener("submit", function (e) {
                if (enviado) { e.preventDefault(); return; }
                enviado = true;
                button.disabled = true;
                button.textContent = "Ingresando...";
            });

            // Si el navegador restaura la página desde caché (botón atrás), reactiva el botón
            window.addEventListener("pageshow", function (e) {
                if (e.persisted) {
                    enviado = false;
                    button.disabled = false;
                    button.textContent = "Iniciar sesión";
                }
            });

            toggle.addEventListener("click", function () {
                const visible = pass.type === "text";
                pass.type = visible ? "password" : "text";
                toggle.textContent = visible ? "Mostrar" : "Ocultar";
                toggle.setAttribute("aria-label", visible ? "Mostrar contraseña" : "Ocultar contraseña");
            });
        })();
    </script>
</body>
</html>
